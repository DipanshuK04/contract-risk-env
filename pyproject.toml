[project]
name = "contract-risk-env"
version = "1.0.0"
description = "OpenEnv environment for AI contract risk analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "requests>=2.32.0",
    "python-multipart>=0.0.9",
    "openenv-core>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "api*"]

[tool.openenv]
name = "contract-risk-env"
spec_version = 1
app = "api.app:app"
port = 7860